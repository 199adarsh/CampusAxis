# Server Configuration
server.port=${PORT:10000}
server.address=0.0.0.0
spring.main.lazy-initialization=true

# HTTP Response Compression (GZIP for high-speed API & lightweight mobile delivery)
server.compression.enabled=true
server.compression.mime-types=text/html,text/xml,text/plain,text/css,text/javascript,application/javascript,application/json,application/xml
server.compression.min-response-size=1024

# Universal Database Configuration (Provider-agnostic: Aiven, Neon, Supabase, Docker)
spring.datasource.url=${DB_JDBC_URL:${DATABASE_JDBC_URL:${AIVEN_JDBC_URL:${NEON_JDBC_URL:${SUPABASE_JDBC_URL:}}}}}
spring.datasource.username=${DB_USER:${DB_USERNAME:${AIVEN_DB_USER:${NEON_DB_USER:${SUPABASE_DB_USER:}}}}}
spring.datasource.password=${DB_PASSWORD:${AIVEN_DB_PASSWORD:${NEON_DB_PASSWORD:${SUPABASE_DB_PASSWORD:}}}}

# Spring AI MCP Server Configuration
spring.ai.mcp.server.enabled=true
spring.ai.mcp.server.name=campusaxis
spring.ai.mcp.server.version=1.0.0
spring.ai.mcp.server.sse-endpoint=/sse
spring.ai.mcp.server.sse-message-endpoint=/mcp/message
spring.datasource.driver-class-name=${DB_DRIVER:org.postgresql.Driver}
spring.datasource.hikari.maximum-pool-size=${HIKARI_MAX_POOL_SIZE:10}
spring.datasource.hikari.minimum-idle=${HIKARI_MIN_IDLE:2}
spring.datasource.hikari.connection-timeout=20000
spring.datasource.hikari.max-lifetime=300000
spring.datasource.hikari.idle-timeout=120000
spring.datasource.hikari.keepalive-time=60000
spring.datasource.hikari.connection-test-query=SELECT 1

# JPA Settings
spring.jpa.hibernate.ddl-auto=${DDL_AUTO:none}
spring.sql.init.mode=never
spring.jpa.show-sql=false

# CORS Configuration
spring.web.cors.allowed-origin-patterns=${CORS_ALLOWED_ORIGIN_PATTERNS:http://localhost:*,https://*.vercel.app,https://*.onrender.com}
spring.web.cors.allowed-methods=GET,POST,PUT,DELETE,OPTIONS
spring.web.cors.allowed-headers=*
spring.web.cors.allow-credentials=true

# Logging Configuration
spring.output.ansi.enabled=ALWAYS
spring.jpa.open-in-view=false
logging.level.org.apache.pdfbox=ERROR
logging.level.org.apache.fontbox=ERROR
logging.level.org.springframework.web.servlet.mvc.support.DefaultHandlerExceptionResolver=ERROR
logging.level.org.springframework.web.context.request.async.StandardServletAsyncWebRequest=ERROR
logging.level.org.apache.catalina.connector.CoyoteAdapter=ERROR

# Application Configuration
spring.application.name=campusaxis-backend
app.storage.local-dir=./data
app.gemini.base-url=${GEMINI_BASE_URL:http://localhost:8000/v1}
app.gemini.model=${GEMINI_MODEL:gemini-3.5-flash}
app.groq.api-key=${GROQ_API_KEY:}
app.brabble.api-key=${BRABBLE_API_KEY:}
app.brabble.base-url=${BRABBLE_BASE_URL:https://brabble.ai/api}

# Moodle LMS Credentials (Loaded from Environment)
app.lms.sy.username=${LMS_SY_USER:24UAD019}
app.lms.sy.password=${LMS_SY_PASS:}
app.lms.ty.username=${LMS_TY_USER:24UAD022}
app.lms.ty.password=${LMS_TY_PASS:}
app.b2.access-key-id=${R2_ACCESS_KEY_ID:${B2_ACCESS_KEY_ID:}}
app.b2.secret-access-key=${R2_SECRET_ACCESS_KEY:${B2_SECRET_ACCESS_KEY:}}
app.b2.endpoint=${R2_ENDPOINT:${B2_ENDPOINT:s3.ca-east-006.backblazeb2.com}}
app.b2.region=${R2_REGION:${B2_REGION:auto}}
app.b2.bucket-name=${R2_BUCKET_NAME:${B2_BUCKET_NAME:campusaxis-notes}}
app.b2.nc-bucket-name=${R2_NC_BUCKET_NAME:${B2_NC_BUCKET_NAME:campusaxis-notes}}
app.b2.presigned-url-expiry-minutes=${B2_PRESIGNED_EXPIRY_MINUTES:60}

# Scheduling & Batch Configuration
app.scheduling.pool-size=2
app.scheduling.thread-name-prefix=eduvault-scheduler-
app.batch.okf.enabled=true
app.batch.okf.cron=0 0 2 * * ?
app.batch.okf.idle-check-ms=900000
app.batch.okf.idle-threshold-ms=1800000

# GitHub OKF Persistent Storage (Render & Cloud Sync)
app.github.enabled=${GITHUB_OKF_ENABLED:true}
app.github.token=${GITHUB_TOKEN:}
app.github.repo=${GITHUB_REPO:199adarsh/CampusAxis}
app.github.branch=${GITHUB_BRANCH:main}
app.github.okf-path=${GITHUB_OKF_PATH:backend/data/okf}
