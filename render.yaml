services:
  - type: web
    name: eduvault
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: free
    region: singapore
    healthCheckPath: /health
    envVars:
      - key: PORT
        value: 10000
      - key: NEON_JDBC_URL
        sync: false
      - key: NEON_DB_USER
        sync: false
      - key: NEON_DB_PASSWORD
        sync: false
      - key: R2_ACCESS_KEY_ID
        sync: false
      - key: R2_SECRET_ACCESS_KEY
        sync: false
      - key: R2_ENDPOINT
        value: https://ed699a622be1d0fe280023629e3e007e.r2.cloudflarestorage.com
      - key: R2_BUCKET_NAME
        value: campusaxis-notes
      - key: R2_REGION
        value: auto
      - key: DDL_AUTO
        value: update
      - key: GROQ_API_KEY
        sync: false
